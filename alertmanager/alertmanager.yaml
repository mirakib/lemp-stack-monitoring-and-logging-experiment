global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "moshrekulislam12@gmail.com"
  smtp_auth_username: "moshrekulislam12@gmail.com"
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: cpu-email
  group_by: [alertname, instance]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: cpu-email
      matchers:
        - alertname="CPUUsageHigh"

receivers:
  - name: cpu-email
    email_configs:
      - to: "mirakib.dev@gmail.com"
        send_resolved: true
